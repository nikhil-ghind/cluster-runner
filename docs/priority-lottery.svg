  </g>
  <g opacity="0">
    <rect x="-20" y="-13" width="40" height="26" rx="5" fill="#a371f7" opacity="0.85"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.905;0.975;0.98;1" dur="12.0s" repeatCount="indefinite"/>
    <animateMotion dur="12.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.9;0.975;1" calcMode="linear" path="M535,290 C580,290 580,210 616,210"/>
  </g>
  <rect x="620" y="150" width="250" height="120" rx="8" fill="none" stroke="#8b949e" stroke-width="1.8"/>
  <text x="745" y="176" font-family="sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">scheduler workers</text>
  <text x="745" y="196" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">N tokio tasks, each dequeues</text>
  <text x="745" y="214" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">then waits on a Semaphore permit</text>
  <text x="745" y="234" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">kube.pod_for(job) then submit_pod</text>
  <text x="745" y="254" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">permit held until the pod is terminal</text>
  <path d="M745,274 L745,310" stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#mk)"/>
  <rect x="640" y="316" width="210" height="44" rx="7" fill="none" stroke="#3fb950" stroke-width="1.6"/>
  <text x="745" y="336" font-family="sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">Pod created on the cluster</text>
  <text x="745" y="352" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">node selector picks on-prem or AWS</text>
  <text x="450" y="400" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">a failed pod submit re-enqueues the job with one fewer retry, so it rejoins the same lottery</text>
  <text x="450" y="420" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">if the rolled bucket is empty the scheduler walks down to the next non-empty one, then upward</text>
</svg>