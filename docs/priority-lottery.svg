  </g>
  <g opacity="0">
    <rect x="-20" y="-13" width="40" height="26" rx="5" fill="#58a6ff" opacity="0.85"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.705;0.775;0.78;1" dur="12.0s" repeatCount="indefinite"/>
    <animateMotion dur="12.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.7;0.775;1" calcMode="linear" path="M535,245 C580,245 580,210 616,210"/>
  </g>
  <g opacity="0">
    <rect x="-20" y="-13" width="40" height="26" rx="5" fill="#f85149" opacity="0.85"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.805;0.875;0.88;1" dur="12.0s" repeatCount="indefinite"/>
