<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="A five-bucket priority queue drained by a weighted lottery: critical is picked most often but every bucket including idle gets served, and each pick becomes a pod once a semaphore permit is free">
  <title>Weighted lottery over five priority buckets</title>
  <defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
  <text x="20" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#8b949e">Priority queue: weighted lottery, not strict priority</text>
  <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#8b949e">weights 16 / 8 / 4 / 2 / 1 — critical wins most rolls, but an idle job is never starved out entirely</text>
  <text x="30" y="115" font-family="sans-serif" font-size="13" fill="#f85149">critical</text>
  <text x="30" y="131" font-family="sans-serif" font-size="11" fill="#8b949e">weight 16</text>
  <rect x="130" y="97" width="40" height="26" rx="5" fill="#f85149" opacity="0.28" stroke="#f85149" stroke-width="1.2"/>
  <rect x="176" y="97" width="40" height="26" rx="5" fill="#f85149" opacity="0.28" stroke="#f85149" stroke-width="1.2"/>
