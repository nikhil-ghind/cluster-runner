  <rect x="352" y="189" width="122" height="22" rx="4" fill="none" stroke="#6e7681" stroke-width="1"/>
  <rect x="353" y="190" width="0" height="20" rx="3" fill="#3fb950" opacity="0.55">
    <animate attributeName="width" values="0;0;20;20" keyTimes="0.0;0.499;0.5;1.0" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="250" font-family="sans-serif" font-size="13" fill="#58a6ff">low</text>
