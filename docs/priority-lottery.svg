  <rect x="268" y="97" width="40" height="26" rx="5" fill="#f85149" opacity="0.28" stroke="#f85149" stroke-width="1.2"/>
  <text x="322" y="115" font-family="sans-serif" font-size="12" fill="#8b949e">…</text>
  <rect x="352" y="99" width="122" height="22" rx="4" fill="none" stroke="#6e7681" stroke-width="1"/>
  <rect x="353" y="100" width="0" height="20" rx="3" fill="#f85149" opacity="0.55">
    <animate attributeName="width" values="0;0;20;20;40;40;60;60;80;80;100;100" keyTimes="0.0;0.099;0.1;0.199;0.2;0.399;0.4;0.699;0.7;0.899;0.9;1.0" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="160" font-family="sans-serif" font-size="13" fill="#d29922">high</text>
  <text x="30" y="176" font-family="sans-serif" font-size="11" fill="#8b949e">weight 8</text>
  <rect x="130" y="142" width="40" height="26" rx="5" fill="#d29922" opacity="0.28" stroke="#d29922" stroke-width="1.2"/>
  <rect x="176" y="142" width="40" height="26" rx="5" fill="#d29922" opacity="0.28" stroke="#d29922" stroke-width="1.2"/>
  <rect x="222" y="142" width="40" height="26" rx="5" fill="#d29922" opacity="0.28" stroke="#d29922" stroke-width="1.2"/>
  <rect x="268" y="142" width="40" height="26" rx="5" fill="#d29922" opacity="0.28" stroke="#d29922" stroke-width="1.2"/>
  <text x="322" y="160" font-family="sans-serif" font-size="12" fill="#8b949e">…</text>
