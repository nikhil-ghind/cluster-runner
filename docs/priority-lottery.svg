  </g>
  <g opacity="0">
    <rect x="-20" y="-13" width="40" height="26" rx="5" fill="#d29922" opacity="0.85"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.505;0.575;0.58;1" dur="12.0s" repeatCount="indefinite"/>
    <animateMotion dur="12.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.575;1" calcMode="linear" path="M535,155 C580,155 580,210 616,210"/>
  </g>
  <g opacity="0">
    <rect x="-20" y="-13" width="40" height="26" rx="5" fill="#f85149" opacity="0.85"/>
