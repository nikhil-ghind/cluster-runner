  <rect x="353" y="145" width="0" height="20" rx="3" fill="#d29922" opacity="0.55">
    <animate attributeName="width" values="0;0;20;20;40;40" keyTimes="0.0;0.299;0.3;0.599;0.6;1.0" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="205" font-family="sans-serif" font-size="13" fill="#3fb950">normal</text>
  <text x="30" y="221" font-family="sans-serif" font-size="11" fill="#8b949e">weight 4</text>
  <rect x="130" y="187" width="40" height="26" rx="5" fill="#3fb950" opacity="0.28" stroke="#3fb950" stroke-width="1.2"/>
  <rect x="176" y="187" width="40" height="26" rx="5" fill="#3fb950" opacity="0.28" stroke="#3fb950" stroke-width="1.2"/>
