[package]
name = "cluster-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ci-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tonic = "0.11"
prost = "0.12"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
nix = { version = "0.27", features = ["sched", "mount", "process", "user", "signal"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
