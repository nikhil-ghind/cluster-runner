[package]
name = "cluster-dispatcher"
version = "0.1.0"
edition = "2021"
authors = ["Nikhil Ghind <ghind20@gmail.com>"]
description = "HPC CI dispatcher for hybrid-cloud Kubernetes job execution"

[[bin]]
name = "dispatcher"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
kube = { version = "0.88", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.21", features = ["v1_28"] }
schemars = "0.8"
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
prometheus = "0.13"
hyper = { version = "0.14", features = ["full"] }
nix = { version = "0.27", features = ["sched", "mount", "process", "user"] }
libc = "0.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
